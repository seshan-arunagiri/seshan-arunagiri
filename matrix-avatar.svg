<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="155" height="155" viewBox="0 0 155 155">
  <defs>
    <clipPath id="circ">
      <rect x="0" y="0" width="155" height="155" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Black background -->
  <rect width="155" height="155" fill="#000F08" rx="12" ry="12"/>

  <!-- Matrix rain columns (SMIL animated, GitHub-safe) -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#00FF41" clip-path="url(#circ)">

    <text x="12" y="-140">
      0<tspan x="12" dy="13">1</tspan><tspan x="12" dy="13">0</tspan><tspan x="12" dy="13">1</tspan>
      <tspan x="12" dy="13">1</tspan><tspan x="12" dy="13">0</tspan><tspan x="12" dy="13">0</tspan>
      <tspan x="12" dy="13">1</tspan><tspan x="12" dy="13">0</tspan><tspan x="12" dy="13">1</tspan>
      <tspan x="12" dy="13">0</tspan><tspan x="12" dy="13">1</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0s" repeatCount="1"/>
    </text>

    <text x="34" y="-140">
      1<tspan x="34" dy="13">0</tspan><tspan x="34" dy="13">1</tspan><tspan x="34" dy="13">0</tspan>
      <tspan x="34" dy="13">0</tspan><tspan x="34" dy="13">1</tspan><tspan x="34" dy="13">1</tspan>
      <tspan x="34" dy="13">0</tspan><tspan x="34" dy="13">1</tspan><tspan x="34" dy="13">0</tspan>
      <tspan x="34" dy="13">1</tspan><tspan x="34" dy="13">0</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0.22s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0.22s" repeatCount="1"/>
    </text>

    <text x="56" y="-140">
      0<tspan x="56" dy="13">0</tspan><tspan x="56" dy="13">1</tspan><tspan x="56" dy="13">1</tspan>
      <tspan x="56" dy="13">0</tspan><tspan x="56" dy="13">1</tspan><tspan x="56" dy="13">0</tspan>
      <tspan x="56" dy="13">0</tspan><tspan x="56" dy="13">1</tspan><tspan x="56" dy="13">1</tspan>
      <tspan x="56" dy="13">0</tspan><tspan x="56" dy="13">1</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0.10s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0.10s" repeatCount="1"/>
    </text>

    <text x="78" y="-140">
      1<tspan x="78" dy="13">1</tspan><tspan x="78" dy="13">0</tspan><tspan x="78" dy="13">0</tspan>
      <tspan x="78" dy="13">1</tspan><tspan x="78" dy="13">0</tspan><tspan x="78" dy="13">1</tspan>
      <tspan x="78" dy="13">1</tspan><tspan x="78" dy="13">0</tspan><tspan x="78" dy="13">0</tspan>
      <tspan x="78" dy="13">1</tspan><tspan x="78" dy="13">0</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0.33s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0.33s" repeatCount="1"/>
    </text>

    <text x="100" y="-140">
      0<tspan x="100" dy="13">1</tspan><tspan x="100" dy="13">1</tspan><tspan x="100" dy="13">0</tspan>
      <tspan x="100" dy="13">0</tspan><tspan x="100" dy="13">1</tspan><tspan x="100" dy="13">0</tspan>
      <tspan x="100" dy="13">1</tspan><tspan x="100" dy="13">0</tspan><tspan x="100" dy="13">1</tspan>
      <tspan x="100" dy="13">1</tspan><tspan x="100" dy="13">0</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0.18s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0.18s" repeatCount="1"/>
    </text>

    <text x="122" y="-140">
      1<tspan x="122" dy="13">0</tspan><tspan x="122" dy="13">0</tspan><tspan x="122" dy="13">1</tspan>
      <tspan x="122" dy="13">1</tspan><tspan x="122" dy="13">0</tspan><tspan x="122" dy="13">1</tspan>
      <tspan x="122" dy="13">0</tspan><tspan x="122" dy="13">1</tspan><tspan x="122" dy="13">0</tspan>
      <tspan x="122" dy="13">0</tspan><tspan x="122" dy="13">1</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0.28s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0.28s" repeatCount="1"/>
    </text>

    <text x="144" y="-140">
      0<tspan x="144" dy="13">1</tspan><tspan x="144" dy="13">0</tspan><tspan x="144" dy="13">1</tspan>
      <tspan x="144" dy="13">0</tspan><tspan x="144" dy="13">0</tspan><tspan x="144" dy="13">1</tspan>
      <tspan x="144" dy="13">0</tspan><tspan x="144" dy="13">1</tspan><tspan x="144" dy="13">1</tspan>
      <tspan x="144" dy="13">0</tspan><tspan x="144" dy="13">1</tspan>
      <animate attributeName="y" values="-140;170;170" keyTimes="0;0.55;1" dur="3.6s" begin="0.38s" repeatCount="1"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="3.6s" begin="0.38s" repeatCount="1"/>
    </text>
  </g>

  <!-- Profile photo fades in after rain -->
  <image href="https://github.com/seshan-arunagiri.png"
         xlink:href="https://github.com/seshan-arunagiri.png"
         x="0" y="0" width="155" height="155"
         clip-path="url(#circ)"
         preserveAspectRatio="xMidYMid slice"
         opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.70;1" dur="3.6s" begin="0s" fill="freeze" repeatCount="1"/>
  </image>

  <!-- Border overlay -->
  <rect x="1" y="1" width="153" height="153" rx="11" ry="11"
        fill="none" stroke="#FB3640" stroke-width="2"/>
</svg>
